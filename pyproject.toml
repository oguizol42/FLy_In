[project]
name = "FlyIn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.5",
    "pygame>=2.6.1",
]

[project.scripts]
FlyIn = "FlyIn:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.mypy]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]
